<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products Management</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="products-page">

    <div class="products-container">

        <div class="products-header">
            <h1>Products Management</h1>
            <p>Manage your beauty shop products</p>
        </div>

        <!-- ADD PRODUCT FORM -->
        <div class="product-form">

            <input type="text" id="productName"
                   placeholder="Product Name" maxlength="100" required>

            <input type="number" id="buyingPrice"
                   placeholder="Buying Price" min="0"
                   step="0.01" required>

            <input type="number" id="productPrice"
                   placeholder="Selling Price" min="0"
                   step="0.01" required>

            <input type="number" id="productQuantity"
                   placeholder="Quantity" min="1"
                   step="1" required>

            <button type="button" onclick="addProduct()">
                Add Product
            </button>

        </div>

        <!-- SEARCH PRODUCTS -->
        <div class="product-search">
            <input
                type="search"
                id="searchProduct"
                placeholder="Search products by name..."
                oninput="searchProducts()"
            >
        </div>

        <!-- PRODUCT TABLE -->
        <div class="product-table-container">

            <h2>Product List</h2>

            <div class="table-scroll">

                <table class="product-table">

                    <thead>
                        <tr>
                            <th>Product Name</th>
                            <th>Buying Price</th>
                            <th>Selling Price</th>
                            <th>Quantity</th>
                            <th>Date Added</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="productList">
                        <tr>
                            <td colspan="6">Loading products...</td>
                        </tr>
                    </tbody>

                </table>

            </div>

        </div>

        <!-- EDIT PRODUCT MODAL -->
        <div id="editProductModal" class="edit-modal" hidden>

            <div class="edit-modal-content">

                <h2>Edit Product</h2>

                <input type="hidden" id="editProductId">

                <label for="editProductName">Product Name</label>
                <input type="text" id="editProductName"
                       maxlength="100" required>

                <label for="editBuyingPrice">Buying Price</label>
                <input type="number" id="editBuyingPrice"
                       min="0" step="0.01" required>

                <label for="editSellingPrice">Selling Price</label>
                <input type="number" id="editSellingPrice"
                       min="0" step="0.01" required>

                <label for="editProductQuantity">Quantity</label>
                <input type="number" id="editProductQuantity"
                       min="0" step="1" required>

                <div class="edit-modal-actions">

                    <button type="button" onclick="updateProduct()">
                        Save Changes
                    </button>

                    <button type="button"
                            onclick="closeEditModal()">
                        Cancel
                    </button>

                </div>

            </div>

        </div>

        <button class="back-button" onclick="goDashboard()">
            Back to Dashboard
        </button>

    </div>

    <script src="products.js"></script>

</body>
</html>
